<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LASSCO Part Lookup</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:15px system-ui,sans-serif;background:#e9edf1;display:flex;flex-direction:column;height:100vh}
  header{background:#1f2d3d;color:#fff;padding:12px 16px;font-weight:600}
  #log{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;line-height:1.4}
  .me{align-self:flex-end;background:#2b7de9;color:#fff}
  .bot{align-self:flex-start;background:#fff}
  .tbl{align-self:stretch;max-width:100%;background:#fff;border-radius:10px;padding:4px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:11px}
  th{background:#1f2d3d;color:#fff;font-weight:600;text-align:left;padding:4px 3px;white-space:nowrap}
  td{padding:4px 3px;border-bottom:1px solid #e3e8ed;vertical-align:top;word-break:break-word}
  tr:nth-child(even) td{background:#f6f8fa}
  td.n{text-align:right;white-space:nowrap}
  td.part{font-weight:600;word-break:break-all}
  td.d{font-size:10px;line-height:1.25}
  .zero{color:#b0bac4}
  .foot{font-size:12px;color:#6b7785;padding:6px 4px 0}
  form{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #d5dbe1}
  input{flex:1;font-size:16px;padding:10px;border:1px solid #c5ccd3;border-radius:20px;outline:none}
  button{border:0;background:#2b7de9;color:#fff;border-radius:20px;padding:0 18px;font-size:15px}
</style>
</head>
<body>
<header>LASSCO Part Lookup</header>
<div id="log"></div>
<form id="f"><input id="q" autocomplete="off" placeholder="Part number, OE or description"><button>Send</button></form>
<script>
var API = 'https://script.google.com/macros/s/AKfycbwM-Ov_rESIla9qV4mVrJdZXemRlr5uf9fx8WIFps2W35kVIQMwCOREAW1epsZyQm3C/exec';
function call(pin, q) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pin: pin, q: q }) })
    .then(function (r) { return r.json(); });
}
var log = document.getElementById('log'), q = document.getElementById('q'), pin = '';
try { pin = localStorage.getItem('lassco_pin') || ''; } catch (e) {}
function add(t, c) { var d = document.createElement('div'); d.className = 'm ' + c; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
function setPin(p) { pin = p; try { if (p) localStorage.setItem('lassco_pin', p); else localStorage.removeItem('lassco_pin'); } catch (e) {} }
function needPin() { q.type = 'password'; q.placeholder = 'PIN'; }
function ready() { q.type = 'text'; q.placeholder = 'Part number, OE or description'; }
function num(v) { var n = Number(v); return isNaN(n) ? String(v) : String(Math.round(n * 100) / 100); }

var HEAD = ['Item no.', 'OE', 'Stock', 'Sold', 'Description', 'Selling'];
function cell(tr, text, cls) { var td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); return td; }

// rows: [item, oe, stock, sold26, sold25 (unused), desc, selling, currency]
function table(res) {
  var box = document.createElement('div'); box.className = 'tbl';
  var t = document.createElement('table'), hr = document.createElement('tr');
  HEAD.forEach(function (h) { var th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
  t.appendChild(hr);
  res.rows.forEach(function (r) {
    var tr = document.createElement('tr');
    cell(tr, r[0], 'part');
    cell(tr, r[1] || '-');
    [2, 3].forEach(function (i) { cell(tr, num(r[i]), 'n' + (Number(r[i]) === 0 ? ' zero' : '')); });
    var d = cell(tr, r[5] || '', 'd'); d.dir = 'auto';
    cell(tr, num(r[6]) + ' ' + (r[7] || ''), 'n');
    t.appendChild(tr);
  });
  box.appendChild(t);
  var foot = [];
  if (res.note) foot.push(res.note);
  if (res.more) foot.push('+' + res.more + ' more, add a word like a model or brand.');
  if (res.updated) foot.push('Data of ' + res.updated);
  if (foot.length) { var f = document.createElement('div'); f.className = 'foot'; f.textContent = foot.join('  '); box.appendChild(f); }
  return box;
}

add('Send a part number, OE number or words from the description (Arabic or English).', 'bot');
if (pin) { ready(); } else { add('Enter the PIN first.', 'bot'); needPin(); }

document.getElementById('f').onsubmit = function (ev) {
  ev.preventDefault();
  var t = q.value.trim(); if (!t) return;
  q.value = '';
  var asking = !pin;
  add(asking ? '••••' : t, 'me');
  var w = add('...', 'bot');
  call(asking ? t : pin, asking ? '' : t)
    .then(function (r) {
      if (!r.ok) { setPin(''); needPin(); w.textContent = asking ? (r.text || 'Wrong PIN, try again.') : (r.text || 'PIN no longer valid. Enter the PIN.'); }
      else if (asking) { setPin(t); ready(); w.textContent = 'Unlocked. Send a part number or description.'; }
      else if (r.res.rows) { w.replaceWith(table(r.res)); }
      else { w.textContent = r.res.msg; }
      log.scrollTop = log.scrollHeight;
    })
    .catch(function (e) { w.textContent = 'Error: ' + e.message; });
};
</script>
</body>
</html>
